<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><rect width="1600" height="1000" fill="#f3f1ec"/><rect x="160" y="110" width="1280" height="780" rx="16" fill="#ffffff" stroke="#d5d9e0"/><text x="220" y="196" font-family="system-ui,sans-serif" font-size="34" font-weight="600" fill="#3b4250">Decision log</text><rect x="1180" y="160" width="200" height="52" rx="10" fill="#e6eef8"/><text x="1280" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#2f5f99">This Friday</text><line x1="220" x2="1380" y1="260" y2="260" stroke="#e5e8ec"/><text x="220" y="330" font-family="system-ui,sans-serif" font-size="24" fill="#7b8494">Fri, wk 2</text><text x="420" y="330" font-family="system-ui,sans-serif" font-size="28" fill="#3b4250">Pause the export redesign</text><rect x="1210" y="300" width="170" height="44" rx="22" fill="#f3f1ec"/><text x="1295" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#5d6574">4 notes</text><line x1="220" x2="1380" y1="380" y2="380" stroke="#e5e8ec"/><text x="220" y="450" font-family="system-ui,sans-serif" font-size="24" fill="#7b8494">Fri, wk 3</text><text x="420" y="450" font-family="system-ui,sans-serif" font-size="28" fill="#3b4250">Show invoice status on the day view</text><rect x="1210" y="420" width="170" height="44" rx="22" fill="#f3f1ec"/><text x="1295" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#5d6574">6 notes</text><line x1="220" x2="1380" y1="500" y2="500" stroke="#e5e8ec"/><text x="220" y="570" font-family="system-ui,sans-serif" font-size="24" fill="#7b8494">Fri, wk 4</text><text x="420" y="570" font-family="system-ui,sans-serif" font-size="28" fill="#3b4250">Cut the reporting tab from the next build</text><rect x="1210" y="540" width="170" height="44" rx="22" fill="#f3f1ec"/><text x="1295" y="570" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#5d6