name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scrub:
    # Runs first and alone: nothing installs or builds until the repo is clean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrub check (paths, secrets, names)
        run: node scripts/scrub.mjs
      - name: Secret scan over the full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: packages typecheck and test against each other's built output.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Credits check (a new dependency needs a credit)
        run: pnpm credits
